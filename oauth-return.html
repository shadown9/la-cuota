<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>La Cuota — Volviendo a la aplicación</title>
<style>
  html,body{margin:0;padding:0;background:#ffffff;color:#1a1a1a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .caja{max-width:420px;margin:0 auto;padding:72px 24px;text-align:center;}
  .logo{font-size:28px;font-weight:800;color:#0b7a55;margin-bottom:12px;}
  p{font-size:17px;margin:12px 0;}
  .peq{font-size:14px;color:#666;}
  button{font-size:17px;font-weight:700;color:#fff;background:#0b7a55;border:0;
    border-radius:12px;padding:14px 28px;margin-top:18px;cursor:pointer;}
</style>
</head>
<body>
<div class="caja">
  <div class="logo">La Cuota</div>
  <p>Volviendo a la aplicación…</p>
  <p class="peq">Si no regresas solo en unos segundos, toca el botón.</p>
  <button id="volver" type="button">Volver a La Cuota</button>
</div>
<script>
/* Puente del inicio de sesión con Google (envoltura nativa Android).
   Google regresa aquí a https://lacuota.org/oauth-return.html con
   ?code=...&state=... (o ?error=... si el usuario canceló).
   Esta página reenvía el resultado al esquema de la aplicación
   (lacuota://oauth), que la app instalada captura con su intent-filter.
   No guarda nada: el secreto PKCE queda solo en la aplicación. */
(function(){
  function param(n){
    var m = String(location.search || '').match(new RegExp('[?&]'+n+'=([^&]+)'));
    return m ? m[1] : '';
  }
  var code = param('code'), state = param('state'), err = param('error');
  var dest;
  if(err){
    dest = 'lacuota://oauth?error=' + encodeURIComponent(err);
  }else{
    dest = 'lacuota://oauth?code=' + encodeURIComponent(code) +
           '&state=' + encodeURIComponent(state);
  }
  function ir(){ try{ location.href = dest; }catch(e){} }
  var b = document.getElementById('volver');
  if(b) b.onclick = ir;
  /* Un intento automático y el botón como respaldo (algunos navegadores
     bloquean la redirección automática a esquemas de aplicación).
     Tras reenviar, cerrar la pestaña (la Custom Tab lo permite): así no
     queda una pantalla del navegador detrás al volver a la aplicación. */
  function cerrar(){ try{ window.close(); }catch(e){} }
  setTimeout(ir, 400);
  setTimeout(cerrar, 1500);
  if(b) b.addEventListener('click', function(){ setTimeout(cerrar, 800); });
})();
</script>
</body>
</html>
